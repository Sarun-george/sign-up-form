    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Sign Up</title>
    </head>
    <body>
        <div class="container">
        <div class="side-image">
            <img src="https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <div class="image-logo">
                <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="logo">
                <p>ODIN</p>
            </div>
        </div>
        <div class="main-content">
            <div class="first-section">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p class="second-sentence">You know you want to.</p>
            </div>
            <div class="second-section">
                <h2>Let's do this!</h2>
                <form action="#">
                    <div class="row">
                        <label for="first_name">FIRST NAME</label>
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="first_name" name="first_name" required>
                        <input type="text" name="last_name" id="last_name">
 
                        <label for="email">EMAIL</label>
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="email" name="email" id="email" required>
                        <input type="tel" name="phone_number" id="phone_number">
 
                        <label for="password">PASSWORD</label>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" name="password" id="password" required>
                        <input type="password" name="confirm_password" id="confirm_password" required>
                    </div>
                </form>
            </div>
            <div class="third-section">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
    </body>
    </html>
